<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" data-rig-profile="sea_lion_cartoon">

  <!-- body -->
  <g data-part="body">
    <g data-motion-root="">
      <!-- main torso — rounded sea lion shape -->
      <ellipse cx="250" cy="380" rx="110" ry="140" fill="#6B7B8D"/>
      <!-- lighter belly -->
      <ellipse cx="250" cy="400" rx="70" ry="90" fill="#B0C4D8"/>
      <!-- scarf -->
      <rect x="210" y="270" width="80" height="18" rx="9" fill="#E85D3A"/>
      <rect x="245" y="275" width="12" height="35" rx="4" fill="#E85D3A"/>
    </g>
  </g>

  <!-- flipper_left -->
  <g data-part="flipper_left">
    <g data-motion-root="">
      <ellipse cx="150" cy="370" rx="35" ry="18" fill="#5A6A7C" transform="rotate(-25 150 370)"/>
      <ellipse cx="140" cy="365" rx="12" ry="8" fill="#4A5A6C" transform="rotate(-25 140 365)"/>
    </g>
  </g>

  <!-- flipper_right -->
  <g data-part="flipper_right">
    <g data-motion-root="">
      <ellipse cx="350" cy="370" rx="35" ry="18" fill="#5A6A7C" transform="rotate(25 350 370)"/>
      <ellipse cx="360" cy="365" rx="12" ry="8" fill="#4A5A6C" transform="rotate(25 360 365)"/>
    </g>
  </g>

  <!-- head -->
  <g data-part="head">
    <g data-motion-root="">
      <!-- head — rounded sea lion dome -->
      <ellipse cx="250" cy="190" rx="85" ry="75" fill="#6B7B8D"/>
      <!-- face mask — lighter area -->
      <ellipse cx="250" cy="210" rx="55" ry="45" fill="#B0C4D8"/>
      <!-- whisker pads -->
      <ellipse cx="225" cy="225" rx="18" ry="12" fill="#C8D8E8"/>
      <ellipse cx="275" cy="225" rx="18" ry="12" fill="#C8D8E8"/>
      <!-- nose -->
      <ellipse cx="250" cy="222" rx="10" ry="6" fill="#2D2D2D"/>
      <!-- small ear nubs -->
      <ellipse cx="178" cy="165" rx="8" ry="10" fill="#5A6A7C"/>
      <ellipse cx="322" cy="165" rx="8" ry="10" fill="#5A6A7C"/>
    </g>
  </g>

  <!-- eye_left -->
  <g data-part="eye_left" data-default-variant="open">
    <g data-variant="open">
      <ellipse cx="220" cy="190" rx="14" ry="16" fill="white"/>
    </g>
    <g data-variant="closed" display="none">
      <path d="M206,192 Q220,200 234,192" stroke="#2D2D2D" stroke-width="2.5" fill="none"/>
    </g>
  </g>

  <!-- eye_right -->
  <g data-part="eye_right" data-default-variant="open">
    <g data-variant="open">
      <ellipse cx="280" cy="190" rx="14" ry="16" fill="white"/>
    </g>
    <g data-variant="closed" display="none">
      <path d="M266,192 Q280,200 294,192" stroke="#2D2D2D" stroke-width="2.5" fill="none"/>
    </g>
  </g>

  <!-- pupil_left -->
  <g data-part="pupil_left" data-default-variant="center">
    <g data-variant="center">
      <circle cx="220" cy="192" r="8" fill="#2D2D2D"/>
      <circle cx="223" cy="189" r="2.5" fill="white"/>
    </g>
    <g data-variant="left" display="none">
      <circle cx="214" cy="192" r="8" fill="#2D2D2D"/>
      <circle cx="217" cy="189" r="2.5" fill="white"/>
    </g>
    <g data-variant="right" display="none">
      <circle cx="226" cy="192" r="8" fill="#2D2D2D"/>
      <circle cx="229" cy="189" r="2.5" fill="white"/>
    </g>
    <g data-variant="up" display="none">
      <circle cx="220" cy="186" r="8" fill="#2D2D2D"/>
      <circle cx="223" cy="183" r="2.5" fill="white"/>
    </g>
    <g data-variant="down" display="none">
      <circle cx="220" cy="198" r="8" fill="#2D2D2D"/>
      <circle cx="223" cy="195" r="2.5" fill="white"/>
    </g>
    <g data-variant="hidden" display="none">
      <rect x="0" y="0" width="0" height="0" fill="none"/>
    </g>
  </g>

  <!-- pupil_right -->
  <g data-part="pupil_right" data-default-variant="center">
    <g data-variant="center">
      <circle cx="280" cy="192" r="8" fill="#2D2D2D"/>
      <circle cx="283" cy="189" r="2.5" fill="white"/>
    </g>
    <g data-variant="left" display="none">
      <circle cx="274" cy="192" r="8" fill="#2D2D2D"/>
      <circle cx="277" cy="189" r="2.5" fill="white"/>
    </g>
    <g data-variant="right" display="none">
      <circle cx="286" cy="192" r="8" fill="#2D2D2D"/>
      <circle cx="289" cy="189" r="2.5" fill="white"/>
    </g>
    <g data-variant="up" display="none">
      <circle cx="280" cy="186" r="8" fill="#2D2D2D"/>
      <circle cx="283" cy="183" r="2.5" fill="white"/>
    </g>
    <g data-variant="down" display="none">
      <circle cx="280" cy="198" r="8" fill="#2D2D2D"/>
      <circle cx="283" cy="195" r="2.5" fill="white"/>
    </g>
    <g data-variant="hidden" display="none">
      <rect x="0" y="0" width="0" height="0" fill="none"/>
    </g>
  </g>

  <!-- mouth -->
  <g data-part="mouth">
    <g data-viseme="REST">
      <path d="M238,235 Q250,240 262,235" stroke="#2D2D2D" stroke-width="2" fill="none"/>
    </g>
    <g data-viseme="A" display="none">
      <ellipse cx="250" cy="238" rx="9" ry="6" fill="#2D2D2D"/>
      <ellipse cx="250" cy="237" rx="6" ry="3" fill="#C0392B"/>
    </g>
    <g data-viseme="E" display="none">
      <ellipse cx="250" cy="236" rx="10" ry="4" fill="#2D2D2D"/>
      <rect x="244" y="234" width="12" height="2" fill="white"/>
    </g>
    <g data-viseme="O" display="none">
      <ellipse cx="250" cy="238" rx="7" ry="8" fill="#2D2D2D"/>
      <ellipse cx="250" cy="237" rx="4" ry="4" fill="#C0392B"/>
    </g>
    <g data-viseme="U" display="none">
      <ellipse cx="250" cy="238" rx="5" ry="7" fill="#2D2D2D"/>
      <ellipse cx="250" cy="237" rx="3" ry="3" fill="#C0392B"/>
    </g>
    <g data-viseme="MBP" display="none">
      <path d="M238,235 Q250,244 262,235" stroke="#2D2D2D" stroke-width="2" fill="#C0392B"/>
      <line x1="238" y1="235" x2="262" y2="235" stroke="#2D2D2D" stroke-width="2"/>
    </g>
    <g data-viseme="FV" display="none">
      <path d="M238,235 Q250,240 262,235" stroke="#2D2D2D" stroke-width="2" fill="none"/>
      <line x1="250" y1="235" x2="250" y2="230" stroke="white" stroke-width="2"/>
    </g>
    <g data-viseme="SH" display="none">
      <rect x="241" y="233" width="18" height="6" rx="3" fill="#2D2D2D"/>
      <rect x="243" y="234" width="14" height="2" fill="white"/>
    </g>
    <g data-viseme="L" display="none">
      <path d="M238,235 Q250,240 262,235" stroke="#2D2D2D" stroke-width="2" fill="none"/>
      <line x1="250" y1="235" x2="250" y2="242" stroke="#C0392B" stroke-width="2"/>
    </g>
    <g data-viseme="S" display="none">
      <path d="M240,237 Q250,233 260,237" stroke="#2D2D2D" stroke-width="2" fill="none"/>
      <line x1="240" y1="237" x2="260" y2="237" stroke="#2D2D2D" stroke-width="1.5"/>
    </g>
  </g>

  <!-- expressions -->
  <g data-expression="neutral">
    <rect x="0" y="0" width="0" height="0" fill="none"/>
  </g>
  <g data-expression="thinking">
    <!-- raised inner eyebrows, thoughtful look -->
    <path d="M200,172 Q212,165 228,170" stroke="#2D2D2D" stroke-width="2" fill="none"/>
    <path d="M272,170 Q288,165 300,172" stroke="#2D2D2D" stroke-width="2" fill="none"/>
    <!-- subtle chin tuck line -->
    <path d="M240,245 Q250,248 260,245" stroke="#6B7B8D" stroke-width="1" fill="none"/>
  </g>

  <!-- gaze directions -->
  <g data-gaze="center">
    <rect x="0" y="0" width="0" height="0" fill="none"/>
  </g>
  <g data-gaze="left">
    <rect x="0" y="0" width="0" height="0" fill="none"/>
  </g>
  <g data-gaze="right">
    <rect x="0" y="0" width="0" height="0" fill="none"/>
  </g>
  <g data-gaze="up">
    <rect x="0" y="0" width="0" height="0" fill="none"/>
  </g>
  <g data-gaze="down">
    <rect x="0" y="0" width="0" height="0" fill="none"/>
  </g>

</svg>
